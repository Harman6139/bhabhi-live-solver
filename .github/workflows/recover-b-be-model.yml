name: Recover B-BE production model from durable support shards

on:
  workflow_dispatch:
    inputs:
      fit_run_id:
        description: Successful fitted behavior-model run ID
        required: true
        default: "30485863938"
        type: string
      support_run_id:
        description: Support run whose 30 durable shards completed
        required: true
        default: "30486051902"
        type: string
      tool_ref:
        description: Source ref containing the repaired support selector
        required: true
        default: codex/all-models
        type: string

permissions:
  actions: read
  contents: read

jobs:
  merge-model:
    name: Re-score durable shards and package B-BE
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIT_RUN_ID: ${{ inputs.fit_run_id }}
      SUPPORT_RUN_ID: ${{ inputs.support_run_id }}

    steps:
      - name: Check out repaired merge and packaging tools
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tool_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download fitted model and all completed support shards
        id: inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fit" "$RUNNER_TEMP/support-shards"
          gh run download "$FIT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "b-be-behavior-model-*" \
            --dir "$RUNNER_TEMP/fit"
          gh run download "$SUPPORT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "support-*" \
            --dir "$RUNNER_TEMP/support-shards"

          provenance="$(find "$RUNNER_TEMP/fit" -type f -name provenance.txt -print -quit)"
          model="$(find "$RUNNER_TEMP/fit" -type f -name selected-behavior-model.json -print -quit)"
          test -n "$provenance"
          test -n "$model"
          source_sha="$(sed -n 's/^source_commit=//p' "$provenance")"
          test "${#source_sha}" -eq 40

          mapfile -t shards < <(find "$RUNNER_TEMP/support-shards" -type f -name shard.json | sort)
          test "${#shards[@]}" -eq 30
          printf 'model_source_sha=%s\nmodel=%s\nprovenance=%s\n' \
            "$source_sha" "$model" "$provenance" >> "$GITHUB_OUTPUT"

      - name: Deterministically re-score and seal the production model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production"
          npx tsx scripts/merge-phase8-support-tune-shards.ts \
            --input-root "$RUNNER_TEMP/support-shards" \
            --behavior-model "${{ steps.inputs.outputs.model }}" \
            --support-output "$RUNNER_TEMP/production/support-tune" \
            --model-output "$RUNNER_TEMP/production/phase8-production-model.json"

      - name: Build practical authority and verified B-BE execution bundles
        shell: bash
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/production/phase8-production-model.json"
          authority="$RUNNER_TEMP/production/authority"
          npx tsx scripts/prepare-phase8-practical-model-authority.ts \
            --model "$model" \
            --output "$authority"
          npx tsx scripts/create-phase8-execution-bundle.ts \
            --authority "$authority/phase8-manifest-authority.json" \
            --model "$model" \
            --config-id p8-b-behavior-balanced-v1 \
            --output "$authority/b-evaluation-bundle.json"
          npx tsx scripts/create-phase8-execution-bundle.ts \
            --authority "$authority/phase8-manifest-authority.json" \
            --model "$model" \
            --config-id p8-be-behavior-exact-fallback-v1 \
            --output "$authority/be-evaluation-bundle.json"

      - name: Retain model lineage and checksums
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/production"
          tool_commit="$(git rev-parse --verify HEAD)"
          cp "${{ steps.inputs.outputs.model }}" "$target/selected-behavior-model.json"
          cp "${{ steps.inputs.outputs.provenance }}" "$target/behavior-fit-provenance.txt"
          printf '%s\n' \
            "fit_run_id=${FIT_RUN_ID}" \
            "support_run_id=${SUPPORT_RUN_ID}" \
            "recovery_run_id=${GITHUB_RUN_ID}" \
            "source_commit=${tool_commit}" \
            "model_source_commit=${{ steps.inputs.outputs.model_source_sha }}" \
            "tool_commit=${tool_commit}" \
            > "$target/production-provenance.txt"
          find "$target" -type f ! -name all-files.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$target/all-files.sha256"

      - name: Upload recovered canonical production package
        uses: actions/upload-artifact@v4
        with:
          name: b-be-production-model-recovered-${{ env.SUPPORT_RUN_ID }}
          path: ${{ runner.temp }}/production
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
