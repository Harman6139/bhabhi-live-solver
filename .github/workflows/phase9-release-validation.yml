name: Phase 9 release validation

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact documentation-complete release commit or tag
        required: true
        type: string
      evidence_run_id:
        description: Phase 8 confirm-and-release Actions run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase9-release-validation
  cancel-in-progress: false

jobs:
  release-validation:
    name: Exact selected release regression
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      RELEASE_BUNDLE_DIR: artifacts/release/phase9-reference-release-20260728-b
      RELEASE_BUNDLE_PATH: artifacts/release/phase9-reference-release-20260728-b/production-release-bundle.json
      LATENCY_RUN: artifacts/release/latency/phase9-reference-selected-latency-20260728-b
      VALIDATION_PARENT: artifacts/release/validation
      VALIDATION_ID: phase9-reference-release-validation-20260728-b-actions
    steps:
      - name: Check out the documentation-complete release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Download selected release and latency evidence
        uses: actions/download-artifact@v4
        with:
          name: phase8-selected-release-${{ inputs.evidence_run_id }}
          path: ${{ runner.temp }}/selected-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}

      - name: Restore the selected bundle and latency evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'selected-release'
          $release = Get-ChildItem -LiteralPath $download -Directory -Recurse |
            Where-Object { $_.Name -eq 'phase9-reference-release-20260728-b' } |
            Select-Object -First 1
          $latency = Get-ChildItem -LiteralPath $download -Directory -Recurse |
            Where-Object { $_.Name -eq 'phase9-reference-selected-latency-20260728-b-actions' } |
            Select-Object -First 1
          if ($null -eq $release -or $null -eq $latency) {
            throw 'Selected-release artifact is missing its bundle or latency run.'
          }
          New-Item -ItemType Directory -Force -Path $env:RELEASE_BUNDLE_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:LATENCY_RUN | Out-Null
          Copy-Item -LiteralPath (Join-Path $release.FullName 'production-release-bundle.json') -Destination $env:RELEASE_BUNDLE_PATH
          Get-ChildItem -LiteralPath $latency.FullName -Force |
            Copy-Item -Destination $env:LATENCY_RUN -Recurse -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $env:RELEASE_BUNDLE_PATH
          if (git status --short --untracked-files=all) {
            throw 'Restoring ignored release evidence made the release worktree dirty.'
          }

      - name: Set up Node 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run exact selected-release validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx tsx scripts/run-phase9-release-validation.ts `
            --release-bundle $env:RELEASE_BUNDLE_PATH `
            --latency-run $env:LATENCY_RUN `
            --dist dist `
            --output-parent $env:VALIDATION_PARENT `
            --attestation-id $env:VALIDATION_ID

      - name: Upload release attestation and command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-release-validation-${{ github.run_id }}
          path: |
            ${{ env.VALIDATION_PARENT }}/${{ env.VALIDATION_ID }}
          if-no-files-found: warn
          retention-days: 7
